# YAML에서 tab은 금지. 반드시 space 2개 사용
# Our team has been supported by [parent.funder] · [main.funder], as part of [main.program] under [parent.program] 👏

# 연구책임자: Principal Investigator (PI)
# 공동연구자/공동연구원: Co-Investigator (Co-I)
# (공동연구기관의) 연구책임자: Co-Principal Investigator (Co-PI)
# 참여연구자/참여연구원: Participating Researcher

# managers: 각 실무책임자에 since(시작)/until(끝)을 적음 (YYYY-MM)
#   - until 없음  -> 현재 실무책임자 (since ~ Current, 과제 종료 시 종료월로 자동 표시)
#   - until 있음  -> 실무책임자 (이전)  (since ~ until)
#   - 현재/이전 모두 여러 명이면 세로로 나열됨
#   - { ID: "[2025.04] 구본유", name: Bonyou Koo, since: 2026-04 }                 # 현재
#   - { ID: "[2024.06] 서지명", name: Jimyeung Seo, since: 2026-04 }               # 현재 (여러 명 가능)
#   - { ID: "[2024.11] 이동천", name: Dong-Cheon Lee, since: 2025-09, until: 2026-04 }  # 이전
# participants: 매니저가 아닌 추가 참여자만 적으면 됨
#   (실무책임자는 '참여자' 명단에 자동 포함되어 함께 표시됨. 중복 입력 불필요)
#   - { ID: "[2024.11] 이동천", name: Dong-Cheon Lee }


