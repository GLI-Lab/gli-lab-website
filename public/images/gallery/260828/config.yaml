date: "2026-08-28"
title: "26-1학기 종강 기념 회식"
description: |
  26-1학기 종강과 여름방학 마무리를 겸해, 대학원 및 학부연구생들과 함께
  그동안의 시간을 정리하는 회식 자리를 가졌습니다.
  한 학기 동안, 그리고 이번 방학 동안 다들 정말 고생 많았습니다.

  과제, 제안서, 논문, 프로젝트 등 도전과 실패를 겪으며 정신없이 또 한 학기가 지나버렸네요.
  그동안 서로 얼마나 바빴는지...
  뜻대로 되지 않은 일도 많았지만, 분명 그 실패들은 각자를 성장시키고있고 저는 느끼고있습니다.
  2학기에도 잘 부탁드립니다.
