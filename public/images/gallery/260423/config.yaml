title: "26-1학기 중간 회식"
description: |
  26-1학기 중간고사를 마무리하는 시점에 대학원생들과 함께 잠시 숨을 고르는 회식 자리를 가졌습니다.
  학기 절반을 달려오느라 다들 고생 많았습니다.
 
  우리 연구실은 이번 학기에도 열정적으로 달려가고 있습니다.
  
