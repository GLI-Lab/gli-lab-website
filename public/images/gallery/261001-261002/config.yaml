date: "2026-10-01 ~ 2026-10-02"
title: "AI최고급신진연구자지원 워크숍 (한국, 제주도)"
description: |
  2세부(건국대 오병국) 연구실은 2026년 10월 1~2일 제주대·건국대에서 개최된 AI최고급신진연구자지원 킥오프 워크숍에 참석하여
  사업 목표와 세부 프로젝트별 추진계획을 공유하고 공동연구 방안을 협의하였습니다.

  본 과제는 AI 모델을 기능 단위(AI Unit)로 나누어, 현장 상황이 바뀔 때 필요한 기능만 새로 학습하고
  다시 결합하면서도 기존 기능과 안전성은 그대로 유지하는 기술을 개발하는 것을 목표로 합니다.

  오병국 교수는 2세부(영상통화 딥페이크 방어 및 에이전트 인증, PL 홍상우 교수)에서 그래프 기반으로 공격과
  권한 오남용을 탐지하고, 그 결과에 따라 추가 인증이나 차단을 결정하는 기술을 맡고 있으며, 제주대 윤여찬 교수,
  건국대 홍상우 교수 연구팀 및 협력기업 메사쿠어컴퍼니와 이를 연결하는 공동연구를 진행할 예정입니다.

  워크숍 이후에는 연구실 학생 백혜윤, 이동천, 구본유와 함께 제주도에서 잠시 휴식을 가졌습니다 :)
  \n